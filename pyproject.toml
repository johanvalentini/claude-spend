[project]
name = "claude-spend"
version = "0.1.0"
description = "Live Claude Code token/cost collector (OTLP receiver) and TUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Valentini Jensen" }]
requires-python = ">=3.12"
# Developed on 3.14; 3.12 is the oldest version tested.
dependencies = [
    "textual>=0.80",
    "textual-plotext>=1.0.1",
]

[project.scripts]
claude-spend = "claude_spend.cli:main"
claude-spend-collector = "claude_spend.collector:main"
claude-spend-tui = "claude_spend.tui:main"
claude-spend-report = "claude_spend.report:main"

[project.urls]
Homepage = "https://github.com/johanvalentini/claude-spend"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_spend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
